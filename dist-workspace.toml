[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# The npm package, `@feds01/zenith`, which installs the binary for the platform
npm-scope = "@feds01"
# The Homebrew tap that the formula is published to: `brew install feds01/tap/zenith`
tap = "feds01/homebrew-tap"
# Publish the npm package and the Homebrew formula with each release, by our
# own jobs, which run `just publish-npm` and `just publish-formula`. The npm
# package is staged with npm's trusted publishing, without a token, and goes
# live once a maintainer approves it.
publish-jobs = ["./publish-homebrew", "./publish-npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Only run the release workflow for release tags, never on PRs
pr-run-mode = "skip"

# The permissions of our publish jobs. npm's trusted publishing needs an OIDC
# token, and npm trusts any job in the release workflow that has one, so only
# the npm job gets one.
[dist.github-custom-job-permissions]
"publish-homebrew" = { contents = "read" }
"publish-npm" = { contents = "read", id-token = "write" }

# The versions of the GitHub actions that the release workflow uses
[dist.github-action-commits]
# v7.0.1
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
