#:schema https://raw.githubusercontent.com/feds01/zenith/main/zenith.schema.json

# zenith checks its own architecture.

[files]
exclude = ["tests/**"]     # the UI test cases are projects of their own

[languages.rust]

# Every crate has a place here: a new crate takes one, or nothing checks it.
[contracts.crate-layers]
type = "layers"
name = "Crates only depend on the layers below them"
layers = [
  "pkg:zenith | pkg:zenith_benchmark",
  "pkg:zenith_contracts",
  "pkg:zenith_pipeline",
  "pkg:zenith_lang_*",
  "pkg:zenith_config",
  "pkg:zenith_lang",
  "pkg:zenith_cache | pkg:zenith_graph | pkg:zenith_lsp | pkg:zenith_workspace",
  "pkg:zenith_diagnostics",
  "pkg:zenith_macros | pkg:zenith_utils",
]
guidance = "Move the shared code down to a layer that both crates may import."

[contracts.languages-independent]
type = "independence"
name = "Languages know nothing of each other"
modules = ["pkg:zenith_lang_*"]
guidance = "Share code between languages through zenith_lang."

[contracts.languages-behind-the-pipeline]
type = "protected"
name = "Languages are only reached through the pipeline"
modules = ["pkg:zenith_lang_*"]
allowed_importers = ["pkg:zenith_pipeline", "pkg:zenith_benchmark"]
guidance = "Reach a language through the interfaces in zenith_config and zenith_lang."

[contracts.parsers-in-languages]
type = "protected"
name = "Parsers and resolvers stay in their languages"
modules = ["crate:oxc_*", "crate:ra_ap_*", "crate:ruff_*", "crate:tree-sitter*", "crate:yaml-rust2"]
allowed_importers = ["pkg:zenith_lang_*"]
guidance = "Expose what the parser finds through the types in zenith_lang."

[contracts.command-line-in-the-cli]
type = "protected"
name = "Only the CLI parses arguments and reports errors with anyhow"
modules = ["crate:anyhow", "crate:argfile", "crate:clap"]
allowed_importers = ["pkg:zenith"]
guidance = "Return a typed error that implements `Diagnostic`, and leave the command line to the CLI."

[contracts.walker-in-the-workspace]
type = "protected"
name = "Only zenith_workspace walks the file system"
modules = ["crate:ignore"]
allowed_importers = ["pkg:zenith_workspace"]
guidance = "Walk files through zenith_workspace."

# The CLI's test of `zenith lsp` plays the editor, which speaks it too.
[contracts.protocol-in-the-server]
type = "protected"
name = "Only zenith_lsp speaks the Language Server Protocol"
modules = ["crate:lsp-server", "crate:lsp-types"]
allowed_importers = ["pkg:zenith_lsp", "crates/zenith/tests/lsp.rs"]
guidance = "Give zenith_lsp reports to publish, and leave the protocol to it."

[contracts.messages-in-the-catalogue]
type = "protected"
name = "Only zenith_diagnostics renders messages"
modules = ["crate:annotate-snippets", "crate:fluent-*", "crate:unic-langid"]
allowed_importers = ["pkg:zenith_diagnostics", "pkg:zenith_macros"]
guidance = "Name a message with `#[derive(Diagnostic)]` or `message!`, and keep its text in the catalogue."

[contracts.languages-given-their-files]
type = "forbidden"
name = "Languages parse and resolve what the pipeline gives them"
from = ["pkg:zenith_lang_*"]
to = ["pkg:zenith_cache", "pkg:zenith_workspace"]
guidance = "Leave walking and caching to the pipeline, and pass the language what it needs."

# zenith_lang writes what a file imports into the cache, and the baseline
# follows the files that git renamed.

[contracts.cache-behind-the-pipeline]
type = "protected"
name = "Only the pipeline reads and writes the parse cache"
modules = ["pkg:zenith_cache"]
allowed_importers = ["pkg:zenith_benchmark", "pkg:zenith_lang", "pkg:zenith_pipeline"]
guidance = "Reach the cache through the pipeline's session."

[contracts.workspace-behind-the-pipeline]
type = "protected"
name = "Only the CLI and the pipeline walk the project and read git"
modules = ["pkg:zenith_workspace"]
allowed_importers = ["pkg:zenith", "pkg:zenith_benchmark", "pkg:zenith_pipeline", "crates/zenith_contracts/src/baseline.rs"]
guidance = "Take the files from the pipeline, or a `FileSystem` from the caller."

[contracts.code-generation-in-the-macros]
type = "protected"
name = "Only zenith_macros generates code"
modules = ["crate:proc-macro2", "crate:quote", "crate:syn"]
allowed_importers = ["pkg:zenith_macros"]
guidance = "Write a macro in zenith_macros."

[contracts.allocator-in-the-binaries]
type = "protected"
name = "Only the binaries choose the allocator"
modules = ["crate:mimalloc"]
allowed_importers = ["crates/zenith/src/main.rs", "crates/zenith_benchmark/benches"]
guidance = "Set the global allocator in a binary, not in a library."

[contracts.paths-in-the-utils]
type = "protected"
name = "Only zenith_utils normalises and canonicalises paths"
modules = ["crate:dunce", "crate:path-absolutize"]
allowed_importers = ["pkg:zenith_utils"]
guidance = "Use the helpers in `zenith_utils::path` and `zenith_utils::fs`."

[contracts.lsp-knows-nothing-of-checks]
type = "forbidden"
name = "The language server knows nothing of what is checked"
from = ["pkg:zenith_lsp"]
to = ["pkg:zenith_contracts", "pkg:zenith_pipeline", "pkg:zenith_graph"]
guidance = "Give the server reports to publish, from the command that checks the project."

# Inside a crate, modules reach each other's items through the re-exports of
# lib.rs and mod.rs, which zenith doesn't follow in Rust, so only direct
# imports between them count.

[contracts.commands-independent]
type = "independence"
name = "Commands don't import each other"
modules = [{ path = "crates/zenith/src/commands/*", except = ["crates/zenith/src/commands/mod.rs"] }]
allow_indirect_imports = true
guidance = "Move what two commands share into the core crates, or into a module of the CLI beside the commands."

[contracts.rules-independent]
type = "independence"
name = "Contract types don't import each other"
modules = [{ path = "crates/zenith_contracts/src/rules/*", except = ["crates/zenith_contracts/src/rules/mod.rs"] }]
allow_indirect_imports = true
guidance = "Move what two contract types share into `rules/mod.rs`, or into a module of zenith_contracts beside the rules."

[contracts.suggest-passes-independent]
type = "independence"
name = "Suggestion passes don't import each other"
modules = [{ path = "crates/zenith_contracts/src/suggest/passes/*", except = ["crates/zenith_contracts/src/suggest/passes/mod.rs"] }]
allow_indirect_imports = true
guidance = "Move what two passes share into `passes/mod.rs`."

[contracts.stages-independent]
type = "independence"
name = "Pipeline stages don't import each other"
modules = [{ path = "crates/zenith_pipeline/src/stages/*", except = ["crates/zenith_pipeline/src/stages/mod.rs"] }]
allow_indirect_imports = true
guidance = "Pass what one stage hands the next through the session."

[contracts.git-independent]
type = "independence"
name = "The walk and each use of git don't import each other"
modules = [
  "crates/zenith_workspace/src/walk.rs",
  { path = "crates/zenith_workspace/src/git/*", except = ["crates/zenith_workspace/src/git/mod.rs"] },
]
allow_indirect_imports = true
guidance = "Move what they share into `git/mod.rs`, or into zenith_utils."

[contracts.modules-acyclic]
type = "acyclic"
name = "A crate's modules don't depend on each other in cycles"
modules = [{ path = "crates/*/src/*", except = ["crates/*/src/lib.rs", "crates/*/src/main.rs"] }]
ignore_imports = [
  # Only tests import the test helpers.
  "crates/*/src/** -> crates/*/src/testing.rs",
  # A type parses itself through `parse`, as `Config::parse` and each
  # language's table do.
  "crates/zenith_config/src/config.rs -> crates/zenith_config/src/parse",
  "crates/zenith_config/src/language.rs -> crates/zenith_config/src/parse",
]
guidance = "Move what both modules need into a third, which both may import."

[contracts.language-stages]
type = "layers"
name = "A language's config builds its backend, which resolves, then parses"
containers = ["crates/zenith_lang_*/src"]
layers = ["config", "backend", "resolve", "parse", "(crates) : (modules) : (packages)"]
allow_indirect_imports = true
guidance = "Parsing knows nothing of resolving, and neither knows the backend: pass them what they need."

[contracts.config-stages]
type = "layers"
name = "zenith.toml is parsed through its schema into the validated types"
containers = ["crates/zenith_config/src"]
layers = ["parse", "schema", "contracts", "selector"]
allow_indirect_imports = true
guidance = "The validated types know nothing of how the file is written: convert in `parse`."

[contracts.contracts-stages]
type = "layers"
name = "Contracts are checked, then reported, then shown"
containers = ["crates/zenith_contracts/src"]
layers = ["output | sarif | schema", "reports | suggest", "contract", "rules", "findings | selection", "view", "baseline | summary"]
allow_indirect_imports = true
guidance = "Contract types find violations, and know nothing of how they are reported."

[contracts.cli-stages]
type = "layers"
name = "Commands run on the project that the CLI's arguments find"
containers = ["crates/zenith/src"]
layers = ["commands", "project", "reporting | version", "cli"]
allow_indirect_imports = true
guidance = "The argument types in `cli.rs` hold no logic: put it in a command, or in the core crates."

[contracts.diagnostics-stages]
type = "layers"
name = "Reports are made from sources, and rendered by the reporter"
containers = ["crates/zenith_diagnostics/src"]
layers = ["diagnostic | reporter", "report", "source"]
allow_indirect_imports = true

[contracts.macros-stages]
type = "layers"
name = "The macros check their messages against the catalogue"
containers = ["crates/zenith_macros/src"]
layers = ["diagnostic", "message", "catalogue"]
allow_indirect_imports = true
