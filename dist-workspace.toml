[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm isn't one: dist's npm package
# downloads the binary in a `postinstall` script, so `just publish-npm` builds
# our own instead, a package per platform from the archives, and
# `@feds01/zenith`, which depends on them all.
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap that the formula is published to: `brew install feds01/tap/zenith`
tap = "feds01/homebrew-tap"
# Publish the Homebrew formula, the npm packages and the VS Code extension with
# each release, but not a pre-release, by our own jobs, which run
# `just publish-formula`, `just publish-npm` and `just vscode::publish`. The
# npm packages are staged with npm's trusted publishing, without a token, and
# go live once a maintainer approves them.
publish-jobs = ["./publish-homebrew", "./publish-npm", "./publish-vscode"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Build only the packages that are released, `cargo build -p zenith`, rather
# than the whole workspace, its benchmarks among it
precise-builds = true
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Only run the release workflow for release tags, never on PRs
pr-run-mode = "skip"

# The permissions of our publish jobs. npm's trusted publishing needs an OIDC
# token, and npm trusts any job in the release workflow that has one, so only
# the npm job gets one.
[dist.github-custom-job-permissions]
"publish-homebrew" = { contents = "read" }
"publish-npm" = { contents = "read", id-token = "write" }
"publish-vscode" = { contents = "read" }

# The versions of the GitHub actions that the release workflow uses, newer
# than dist's defaults, and by tag, as in ci.yml
[dist.github-action-commits]
"actions/checkout" = "v7"
