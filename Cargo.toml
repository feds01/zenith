[workspace]
members = ["crates/zenith*"]

resolver = "2"

[workspace.package]
authors = ["Alexander Fedotov <alexander.fedotov.uk@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/feds01/zenith"

[workspace.dependencies]
zenith = { path = "crates/zenith" }
zenith_config = { path = "crates/zenith_config" }
zenith_contracts = { path = "crates/zenith_contracts" }
zenith_graph = { path = "crates/zenith_graph" }
zenith_index = { path = "crates/zenith_index" }
zenith_parse = { path = "crates/zenith_parse" }
zenith_reporting = { path = "crates/zenith_reporting" }
zenith_resolve = { path = "crates/zenith_resolve" }
zenith_utils = { path = "crates/zenith_utils" }
zenith_workspace = { path = "crates/zenith_workspace" }

annotate-snippets = { version = "0.12.16" }
anyhow = { version = "1.0.104" }
argfile = { version = "1.0.0" }
bitflags = { version = "2.13.2" }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dunce = { version = "1.0.5" }
ignore = { version = "0.4.33" }
indexmap = { version = "2.14.2", features = ["serde"] }
itertools = { version = "0.15.0" }
libtest-mimic = { version = "0.8.2" }
log = { version = "0.4.34" }
oxc_allocator = { version = "0.153.0" }
oxc_ast = { version = "0.153.0" }
oxc_ast_visit = { version = "0.153.0" }
oxc_parser = { version = "0.153.0" }
oxc_resolver = { version = "11.24.3" }
oxc_span = { version = "0.153.0" }
path-absolutize = { version = "4.0.1" }
pretty_assertions = { version = "1.4.1" }
rayon = { version = "1.12.0" }
regex = { version = "1.13.1" }
rustc-hash = { version = "2.1.3" }
schemars = { version = "1.2.2", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strsim = { version = "0.11.1" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.7", features = ["preserve_order"] }
wild = { version = "2.2.1" }
yaml-rust2 = { version = "0.13.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
large_enum_variant = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = true
debug = false

[profile.release-with-dbg-info]
inherits = "release"
debug = true
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
