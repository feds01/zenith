[package]
name = "zenith_resolve"
version = "0.1.0"
description = "Resolves import specifiers the way TypeScript and bundlers do"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[dependencies]
oxc_resolver = { workspace = true }
rustc-hash = { workspace = true }
# `exports` conditions are matched in the order a package lists them, so JSON
# objects must keep their key order.
serde_json = { workspace = true, features = ["preserve_order"] }
zenith_utils = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
