#:schema https://raw.githubusercontent.com/feds01/zenith/main/zenith.schema.json

# An example configuration, with every table and contract type, of the test language.

[files]
exclude = ["experimental/**", "**/*.gen.ts"]
respect_gitignore = true

[languages.test]
include = ["**/*.tst"]
names = ["/*", "virtual:*"]

[analysis]
exclude_kinds = []

[baseline]
path = "zenith.baseline.toml"
stale = "error"

[cache]
enabled = true
dir = ".zenith_cache"

[contracts.client-safety]
type = "forbidden"
name = "Client components never reach server-only code"
from = [{ path = "web/src/**", directive = "use client" }]
to = ["ext:sharp", "core:*", "ext:server-only"]
boundaries = [{ path = "web/src/**", directive = "use server" }]
guidance = "Keep server-only modules out of client bundles."

[contracts.features-independent]
type = "independence"
modules = [{ path = "web/src/features/*", except = ["web/src/features/experimental"] }]
ignore_imports = ["web/src/features/* -> web/src/features/shared"]

[contracts.package-tiers]
type = "layers"
layers = [
  "pkg:web | pkg:sdk | apps/* | services/*",
  "pkg:@acme/ui | pkg:@acme/forms",
  { layer = "pkg:@acme/client", closed = true },
  "pkg:@acme/core",
  "pkg:@acme/types : pkg:@acme/config",
]
exclude_kinds = ["type"]

[contracts.domain-internals]
type = "layers"
containers = ["packages/api/src/domains/*"]
layers = ["hooks", "api", "(types)"]
exhaustive = true
exhaustive_ignores = ["index"]

[contracts.agents-are-api-only]
type = "protected"
modules = ["web/src/agents"]
allowed_importers = ["web/src/app/api"]

[contracts.packages-acyclic]
type = "acyclic"
modules = ["pkg:*"]
exclude_kinds = ["type"]

[contracts.ui-public-surface]
type = "encapsulation"
modules = ["pkg:@acme/ui"]
entrypoints = ["index", "src/components/*/index"]
severity = "warn"

[contracts.small-surface]
type = "limits"
modules = ["web/src/*"]
max_fan_in = 20
max_fan_out = 12
