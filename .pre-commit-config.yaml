repos:
  -   repo: local
      hooks:
      -   id: rust-linting
          name: Rust linting
          description: Run cargo fmt on files included in the commit.
          entry: cargo fmt --all --
          pass_filenames: true
          types: [file, rust]
          language: system
      -   id: rust-clippy
          name: Rust clippy
          description: Run cargo clippy on files included in the commit.
          entry: cargo clippy --workspace --all-targets --all-features -- -Dwarnings
          pass_filenames: false
          types: [file, rust]
          language: system
      -   id: zenith-architecture
          name: Zenith architecture
          description: Check zenith's own contracts, in zenith.toml, on the files that git tracks.
          entry: cargo run -q -p zenith -- check --tracked
          pass_filenames: false
          files: (\.rs|Cargo\.toml|zenith\.toml)$
          language: system
