# Publish the VS Code extension of a release to the VS Code Marketplace and
# Open VSX: a VSIX per platform with that platform's binary, from the
# release's archives, and a universal one without, for the other platforms.
# It publishes with the tokens in the repository's secrets VSCE_PAT and
# OVSX_PAT. The release workflow that dist generates calls it with the
# release's plan, which it doesn't need: the release is of the workspace's
# version.
name: Publish the VS Code extension

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-vscode-extension:
    runs-on: ubuntu-24.04
    steps:
      # This repository, for its justfile and the extension in editors/vscode.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: zenith
      # The archive of each platform's binary.
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: artifacts/
          merge-multiple: true
      # Node runs vsce and ovsx, and assembles the binaries as the npm packages
      # have them, and Bun builds the extension.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Pinned, as they aren't GitHub's own, and each step here could publish
      # the extension.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Without the tokens: this installs the extension's dependencies, and
      # runs their install scripts.
      - name: Package the extension
        run: just --justfile zenith/justfile vscode::packages artifacts vsix
      - name: Publish the extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: just --justfile zenith/justfile vscode::publish vsix
