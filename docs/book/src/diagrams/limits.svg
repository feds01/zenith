<path class="edge ok" d="M391.5,110 L559.5,110" marker-end="url(#li-ok)"/>
<path class="edge ok" d="M402.5,200 L563.5,200" marker-end="url(#li-ok)"/>
<g class="tag"><rect x="42" y="31" width="106" height="18" rx="9"/><text x="95" y="40">max_fan_in = 2</text></g>
<g class="node file"><rect x="45.5" y="57" width="99" height="26" rx="6"/><text x="95" y="70">app/main.ts</text></g>
