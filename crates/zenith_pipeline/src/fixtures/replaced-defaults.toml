[files]
exclude = ["**/*.test.ts"]
respect_gitignore = false

[languages.js]
include = ["web/**"]
tsconfig = "web/tsconfig.json"
conditions = ["browser", "import"]
main_fields = ["main"]
extensions = [".ts", ".js"]
alias = { "types" = "web/src/types", "~" = "web" }
ignore_unresolved = ["virtual:*"]

[baseline]
path = "lint/baseline.toml"

[cache]
dir = ".zenith"
