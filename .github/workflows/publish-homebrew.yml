# Publish the Homebrew formula of a release to the tap, feds01/homebrew-tap.
# The release workflow that dist generates calls it with the release's plan,
# which it doesn't need: the release is of the workspace's version.
name: Publish the Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-24.04
    steps:
      # This repository, for its justfile.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: zenith
      # The tap, which the formula is pushed to.
      - uses: actions/checkout@v7
        with:
          repository: feds01/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
          path: tap
      # The release's artifacts that aren't of a platform, the formula among
      # them.
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-global
          path: tap/Formula/
      # Pinned, as it isn't GitHub's own, and each step here could push to the
      # tap.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Commit and push the formula
        run: just --justfile zenith/justfile publish-formula tap
