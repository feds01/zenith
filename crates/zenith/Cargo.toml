[package]
name = "zenith"
version = "0.1.0"
description = "An architecture linter for TypeScript and JavaScript codebases"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false
default-run = "zenith"

[[bin]]
name = "zenith"
path = "src/main.rs"

[dependencies]
zenith_config = { workspace = true }

anyhow = { workspace = true }
argfile = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
wild = { workspace = true }

# `publish = false` keeps the crate off crates.io; it must still be released
# by cargo-dist.
[package.metadata.dist]
dist = true

[lints]
workspace = true
