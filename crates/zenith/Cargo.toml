[package]
name = "zenith"
version = "0.1.0"
description = "An architecture linter for TypeScript and JavaScript codebases"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false
default-run = "zenith"

[[bin]]
name = "zenith"
path = "src/main.rs"

[dependencies]
zenith_config = { workspace = true }
zenith_contracts = { workspace = true }
zenith_diagnostics = { workspace = true }
zenith_graph = { workspace = true }
zenith_pipeline = { workspace = true }
zenith_resolve = { workspace = true }
zenith_utils = { workspace = true }

annotate-snippets = { workspace = true }
anyhow = { workspace = true }
argfile = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
pretty_assertions = { workspace = true }

# The UI snapshot tests run the binary on the projects in `tests/cases`.
[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false

# `publish = false` keeps the crate off crates.io; it must still be released
# by cargo-dist.
[package.metadata.dist]
dist = true

[lints]
workspace = true
