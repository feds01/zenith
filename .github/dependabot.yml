version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      oxc:
        patterns: ["oxc*"]
      rust-dependencies:
        patterns: ["*"]
        exclude-patterns: ["oxc*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by cargo-dist; update it by bumping
    # `cargo-dist-version` and running `dist generate`.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
