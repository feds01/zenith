name: CodSpeed

on:
  # Every commit on `main` is measured, as the baseline that PRs compare to.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the code that the benchmarks build, i.e. every crate except the CLI.
    paths:
      - "crates/**"
      - "!crates/zenith/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codspeed.yml"
  # Lets CodSpeed backfill results for earlier commits, and measure a branch
  # without a PR (`just bench-ci`).
  workflow_dispatch:

# A new push to a PR cancels its earlier run, but every run on `main` finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # to authenticate with CodSpeed through OpenID Connect

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      # rustup reads the pinned nightly and components from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Dependency caching
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          # Keep in step with `codspeed-divan-compat` in Cargo.toml
          tool: cargo-codspeed@5.0.2

      - name: Build the benchmarks
        run: cargo codspeed build -m simulation -m memory -p zenith_benchmark

      # The simulation counts the instructions of every thread, so work spread
      # over a pool would also count its workers spinning, stealing and parking,
      # which differs from run to run. On one thread, each benchmark counts the
      # same instructions every time. mimalloc returns freed memory to the OS
      # on a timer, which the simulation's slow clock fires in some samples
      # and not others, so it is turned off.
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          RAYON_NUM_THREADS: 1
          MIMALLOC_PURGE_DELAY: -1
        with:
          mode: simulation,memory
          run: cargo codspeed run -p zenith_benchmark
