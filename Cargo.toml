[workspace]
members = ["crates/zenith*"]

resolver = "2"

[workspace.package]
version = "0.5.0"
authors =["Alexander Fedotov <alexander.fedotov.uk@gmail.com>"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/feds01/zenith"
repository = "https://github.com/feds01/zenith"
publish = false

[workspace.dependencies]
zenith_cache = { path = "crates/zenith_cache" }
zenith_config = { path = "crates/zenith_config" }
zenith_contracts = { path = "crates/zenith_contracts" }
zenith_diagnostics = { path = "crates/zenith_diagnostics" }
zenith_graph = { path = "crates/zenith_graph" }
zenith_lang = { path = "crates/zenith_lang" }
zenith_lang_go = { path = "crates/zenith_lang_go" }
zenith_lang_js = { path = "crates/zenith_lang_js" }
zenith_lang_python = { path = "crates/zenith_lang_python" }
zenith_lang_rust = { path = "crates/zenith_lang_rust" }
zenith_lang_terraform = { path = "crates/zenith_lang_terraform" }
zenith_macros = { path = "crates/zenith_macros" }
zenith_pipeline = { path = "crates/zenith_pipeline" }
zenith_reporting = { path = "crates/zenith_reporting" }
zenith_utils = { path = "crates/zenith_utils" }
zenith_workspace = { path = "crates/zenith_workspace" }

annotate-snippets = { version = "0.12.16" }
anyhow = { version = "1.0.104" }
argfile = { version = "1.0.0" }
bitflags = { version = "2.13.2" }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
compact_str = { version = "0.10.0" }
divan = { package = "codspeed-divan-compat", version = "5.0.2" }
dunce = { version = "1.0.5" }
fastrand = { version = "2.5.0" }
fixedbitset = { version = "0.5.7" }
fluent-bundle = { version = "0.16.0" }
fluent-syntax = { version = "0.12.0" }
heck = { version = "0.5.0" }
ignore = { version = "0.4.33" }
index_vec = { version = "0.1.4" }
mimalloc = { version = "0.1.52", default-features = false }
libtest-mimic = { version = "0.8.2" }
indexmap = { version = "2.14.2", features = ["serde"] }
log = { version = "0.4.34" }
oxc_allocator = { version = "0.153.0" }
oxc_ast = { version = "0.153.0" }
oxc_ast_visit = { version = "0.153.0" }
oxc_diagnostics = { version = "0.153.0" }
oxc_parser = { version = "0.153.0" }
oxc_resolver = { version = "11.24.3" }
oxc_span = { version = "0.153.0" }
path-absolutize = { version = "4.0.1" }
pretty_assertions = { version = "1.4.1" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
rayon = { version = "1.12.0" }
ra_ap_syntax = { version = "0.0.359" }
rustc-hash = { version = "2.1.3" }
# Ruff's parser is not on crates.io, so it comes from a tag of Ruff's
# repository, as grimp takes it. It builds with the versions of Ruff's own
# lockfile, so keep `get-size2` and `get-size-derive2` at 0.10.1 in Cargo.lock.
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.15.20" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.15.20" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.15.20" }
schemars = { version = "1.2.2", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strsim = { version = "0.11.1" }
syn = { version = "3.0.6" }
tempfile = { version = "3.27.0" }
thin-vec = { version = "0.2.21" }
tree-sitter = { version = "0.27.1" }
tree-sitter-go = { version = "0.25.0" }
tree-sitter-gomod-orchard = { version = "0.5.3" }
tree-sitter-hcl = { version = "1.1.0" }
toml = { version = "1.1.7", features = ["preserve_order"] }
trybuild = { version = "1.0.122" }
unic-langid = { version = "0.9.6" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(codspeed)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Each worktree has a target directory of its own, so the dev and test builds
# are kept small: line tables, for backtraces and stepping, but not variables'
# debug info, and no incremental cache, which grows to a gigabyte or more. A
# rebuild after an edit is a second or so slower for it; `CARGO_INCREMENTAL=1`
# and `CARGO_PROFILE_DEV_DEBUG=true` bring each back for a shell.
[profile.dev]
debug = "line-tables-only"
incremental = false

[patch.crates-io]
# Ruff's parser takes the names of characters from `unicode_names2` only for
# the `\N{…}` escapes of strings, which zenith doesn't read: the stand-in has
# no table of names, which is most of a megabyte.
unicode_names2 = { path = "vendor/unicode_names2" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
# Strip debug info but keep symbols, so that the crash handler's backtraces
# still name functions.
strip = "debuginfo"
debug = false

[profile.release-with-dbg-info]
inherits = "release"
debug = true
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
