# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates later dependencies.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates use path dependencies without versions.
allow-wildcard-paths = true
# Only the pipeline, and the benchmarks that measure it, may depend on a
# language crate. Everything else reaches the languages through the interfaces
# in `zenith_config` and `zenith_lang`. Go is not in the pipeline yet.
deny = [
  { crate = "zenith_lang_go", wrappers = ["zenith_benchmark"] },
  { crate = "zenith_lang_js", wrappers = ["zenith_pipeline", "zenith_benchmark"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
